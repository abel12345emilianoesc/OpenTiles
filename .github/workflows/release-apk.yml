name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure signing and build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 detectado: compilando APK Release firmado..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            gradle assembleRelease --no-daemon
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            BUILD_VARIANT="release"
          else
            echo "Sin secrets de firma: generando debug.keystore temporal y compilando APK Debug..."
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            gradle assembleDebug --no-daemon
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            BUILD_VARIANT="debug"
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: no se encontró el archivo APK compilado."
            exit 1
          fi

          APK_NAME="OpenTiles-v1.0.${{ github.run_number }}-${BUILD_VARIANT}.apk"
          cp "$APK_SRC" "dist/${APK_NAME}"
          echo "apk_path=dist/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_variant=${BUILD_VARIANT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTiles-v1.0.${{ github.run_number }}-apk
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OpenTiles v1.0.${{ github.run_number }}
          body: |
            Compilación automática de **OpenTiles (Custom Tile)** (`v1.0.${{ github.run_number }}` · variante `${{ steps.build.outputs.build_variant }}`).

            Descarga el archivo `.apk` adjunto o actualiza directamente desde **Ajustes → Buscar actualizaciones** dentro de la aplicación.
          files: ${{ steps.build.outputs.apk_path }}
          generate_release_notes: true
          make_latest: true
